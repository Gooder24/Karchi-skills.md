name: accessibility

# Only a change to Markdown or to the check itself starts a run, so a code-only push creates none.
on:
  pull_request:
    paths:
      - "**.md"
      - .github/a11y-baseline.json
      - .github/scripts/check-docs.py
      - .github/workflows/accessibility.yml
  push:
    branches: [main]
    paths:
      - "**.md"
      - .github/a11y-baseline.json
      - .github/scripts/check-docs.py
      - .github/workflows/accessibility.yml

permissions:
  contents: read

jobs:
  docs:
    name: Documentation accessibility check
    # Karchi's own pushes and PRs run on asus (github/asus-runner.sh in Karchi-skills.md);
    # a pull request from a fork runs on GitHub's machines.
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'asus' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown against the baseline
        run: python3 .github/scripts/check-docs.py
